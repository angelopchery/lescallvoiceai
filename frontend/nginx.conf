# nginx config baked into the frontend container.
# Serves the built SPA and proxies /api -> the host backend (dashboard/server.py on :8080).
# The backend host is reachable as host.docker.internal because the container is run with
#   --add-host=host.docker.internal:host-gateway
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Agent Builder document uploads (PDF/DOCX) can exceed the 1 MB nginx default.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Long-cache hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + SSE -> host backend
    location /api/ {
        proxy_pass         http://host.docker.internal:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for Server-Sent Events (/api/.../stream)
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
    }

    # index.html must NEVER be heuristically cached — it points at the current
    # hashed bundle, so a stale copy makes the browser keep loading OLD JS after
    # every deploy (this caused users to miss shipped fixes). Always revalidate;
    # the ETag makes that a cheap 304 when nothing changed.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA client-side routing fallback
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
