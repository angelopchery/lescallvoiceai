  objection_playbook:
  - id: what_does_the_seva_do
    patterns: []
    answer: {}
    prompt_guidance: '''What do you people do?'' / ''How will you help me get a job?''
      / ''What''s the system?'' → answer plainly from the knowledge band in two sentences
      at most: the office notes their status and what they''re looking for, the team
      follows up with a company when they ask, and when a matching opening comes to
      the office they are told. No guarantees, no timelines, no ''we connect you directly''.
      Then pick up the question you were on.'
  - id: what_happens_next
    patterns: []
    answer: {}
    prompt_guidance: '''So what happens now?'' / ''What''s the procedure?'' → say
      exactly and only this: their details are noted with the office, and the team
      will get in touch if they asked for a follow-up or when something suitable comes.
      Never a date, never a promise.'
  - id: how_got_number
    patterns: []
    answer: {}
    prompt_guidance: '''How did you get my number?'' / ''Who gave you my number?''
      → they registered for the Mahotsav, and the office is calling everyone on that
      list; say it plainly, without apology, and carry on.'
  - id: complaint_about_a_company
    patterns: []
    answer: {}
    prompt_guidance: A complaint about a company or about the fair — no call after
      the interview, an offer that never came, a bad experience → acknowledge it in
      a few honest words, note it in their own words, never defend or explain the
      company or the fair, and ask whether they'd like the team to follow it up.
  - id: already_told_you
    patterns: []
    answer: {}
    prompt_guidance: '''I already told you'' / ''मैंने बोला ना'' → three words of
      apology, take what they said as the answer, and move to the NEXT thing — never
      repeat the question in other words.'
  - id: no_time_now
    patterns: []
    answer: {}
    prompt_guidance: '''I''m busy'' / ''call later'' → say of course, ask when to
      call back, fix the time, and let them go.'
  - id: not_interested
    patterns: []
    answer: {}
    prompt_guidance: '''Not interested'' / ''don''t call me'' → don''t persuade; thank
      them, wish them well from the office, and end the call.'
  closing_responses:
    hi: आपका बहुत-बहुत धन्यवाद। आपकी बात office में note हो गई है — विधायक डॉ. राजेश्वर
      सिंह जी और भारत रोजगार सेवा की तरफ़ से आपके लिए ढेर सारी शुभकामनाएँ।
    en: Thank you so much. Your details are noted with the office — and warm good
