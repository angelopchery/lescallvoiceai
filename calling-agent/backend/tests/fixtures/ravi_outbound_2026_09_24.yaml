  objection_playbook:
  - id: send_brochure
    patterns: []
    answer: {}
    prompt_guidance: '''Just send me the brochure'' / ''WhatsApp me the details''
      → say yes at once and mean it — the Swarit brochure goes to this WhatsApp number.
      Then, in one sentence, that a brochure only tells part of the story of a bungalow,
      and ask whether a quick visit would be alright too.'
  - id: price_too_high
    patterns: []
    answer: {}
    prompt_guidance: '''Too expensive'' / ''out of my budget'' → take it seriously
      and never argue. Swarit starts at about two and a half crore; ask what range
      would feel comfortable and note it for the team, and say the team can walk them
      through payment options at the visit. Do not pitch a cheaper project on your
      own — only if they ask what else we have, answer from the knowledge base.'
  - id: discuss_with_family
    patterns: []
    answer: {}
    prompt_guidance: '''I need to talk to the family'' / ''I''ll call back'' → agree
      that''s exactly right, and suggest they bring the family to the Swarit visit
      itself so everyone walks the bungalow together and the decision gets easier.'
  - id: comparing_builders
    patterns: []
    answer: {}
    prompt_guidance: '''I''m comparing with other builders'' → say comparing is smart;
      ask them not to decide until they''ve physically walked Swarit — paper and a
      walk-through are very different — and mention, once and as a plain fact, that
      Pramukh Group has 30 years and 60-plus projects behind it with not one stalled.'
  - id: builder_reliability
    patterns: []
    answer: {}
    prompt_guidance: '''Is the builder reliable?'' / ''Will it be delayed?'' → call
      it a fair question and one of Pramukh Group''s strongest points: 60-plus projects
      over 30 years, not one stalled, every active project RERA registered — Swarit''s
      RERA number is in the knowledge base — and Swarit itself is ready to move.'
  - id: other_project_question
    patterns: []
    answer: {}
    prompt_guidance: '''Tell me about Sahaj'' / ''What''s the price of Aura?'' / ''Which
      projects do you have?'' → answer plainly and exactly from the knowledge base
      (location, size, price, status as written — never a guess), as much as they
      asked and no more. Then, if it fits, connect it back to Swarit — for instance
      that Swarit stands right opposite Sahaj — and carry on toward the Swarit visit.
      Never volunteer a project they did not ask about.'
  - id: swarit_details
    patterns: []
    answer: {}
    prompt_guidance: '''Tell me more about Swarit'' / ''how big'' / ''what''s the
      price'' / ''how many bungalows'' → answer like a person who knows the project,
      not a brochure: pick the two or three facts that fit what they have told you
      (a big family → the 5 BHK at five and a half to nearly seven thousand square
      feet on a bigger plot; a budget question → two and a half to three and a half
      crore and what that buys; kids → the play area, the lawn, the pool), say numbers
      the way people say them on the phone, and end with one question back. Never
      recite the whole list in one breath.'
  - id: what_options
    patterns: []
    answer: {}
    prompt_guidance: '''What options do you have?'' / ''what do you have in Vapi?''
      / ''which projects are available?'' → Swarit first, by name, with what it is
      (4 and 5 BHK bungalows, New Chala, ready to move); then, only because they asked,
      the other Vapi projects in ONE short clause, exactly as the knowledge base has
      them; then back to the family and what they need. Never the list before Swarit.'
  - id: needs_smaller_home
    patterns: []
    answer: {}
    prompt_guidance: '''I need a 2 BHK'' / ''something smaller'' / ''a flat, not a
      bungalow'' → say honestly that Swarit is 4 and 5 BHK bungalows, and ask whether
      a bungalow could work for the family before assuming it can''t. If it genuinely
      can''t, take their requirement for the team to follow up on; answer about other
      projects only if they ask what else we have.'
  - id: how_got_number
    patterns: []
    answer: {}
    prompt_guidance: '''How did you get my number?'' / ''I didn''t enquire'' → don''t
      argue. Say the enquiry may have come through a property portal or a site form,
      apologise if the call is unwelcome, offer to take them off the list if they
      want — and otherwise ask whether property is still on their mind at all.'
  closing_responses:
    en: Thank you so much — I'm really looking forward to meeting you at the project.
      Anything at all before then, just call or WhatsApp me on this number.
    hi: बहुत शुक्रिया — project पर आपसे मिलने का इंतज़ार रहेगा। उससे पहले कुछ भी हो
      तो इसी नंबर पर कॉल या WhatsApp कर दीजिए।
    gu: ખૂબ આભાર — project પર તમને મળવાની રાહ રહેશે. એ પહેલાં કંઈ પણ હોય તો આ જ નંબર
      પર ફોન કે WhatsApp કરી દેજો.
