  identity_confirm_line:
    en: Good {current_time}! Am I speaking with {contact_name}?
    hi: नमस्ते! क्या मेरी बात {contact_name} जी से हो रही है?
    gu: નમસ્તે! શું મારી વાત {contact_name} સાથે થઈ રહી છે?
  good_time_check_line:
    en: Thanks! It's Ravi here from Pramukh Group — you'd shown interest in one of
      our projects a while back, so I'm just following up. Is now an okay time for
      a quick chat?
    hi: शुक्रिया! मैं रवि बोल रहा हूँ Pramukh Group से — आपने कुछ समय पहले हमारे किसी
      project में interest दिखाया था, तो बस follow-up के लिए कॉल किया। अभी दो मिनट
      बात करना ठीक रहेगा?
    gu: આભાર! હું રવિ બોલું છું Pramukh Group માંથી — તમે થોડા સમય પહેલાં અમારા કોઈ
      project માં interest બતાવ્યો હતો, એટલે બસ follow-up માટે ફોન કર્યો. હમણાં બે
      મિનિટ વાત કરવી ઠીક રહેશે?
  pitch: {}
  wrong_person_response:
