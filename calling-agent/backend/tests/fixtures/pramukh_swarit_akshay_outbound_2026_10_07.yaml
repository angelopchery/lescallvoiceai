  identity_confirm_line:
    en: Good {current_time}! Am I speaking with {contact_name}?
    hi: नमस्ते! क्या मेरी बात {contact_name} जी से हो रही है?
    gu: નમસ્તે! શું મારી વાત {contact_name} સાથે થઈ રહી છે?
  good_time_check_line:
    en: Thanks! It's Akshay here from Pramukh Swarit — you'd shown interest in one
      of our projects a while back, so I'm just following up. Is now an okay time
      for a quick chat?
    hi: शुक्रिया! मैं अक्षय बोल रहा हूँ Pramukh Swarit से — आपने कुछ समय पहले हमारे
      किसी project में interest दिखाया था, तो बस follow-up के लिए कॉल किया। अभी दो
      मिनट बात करना ठीक रहेगा?
    gu: આભાર! હું અક્ષય બોલું છું Pramukh Swarit માંથી — તમે થોડા સમય પહેલાં અમારા
      કોઈ project માં interest બતાવ્યો હતો, એટલે બસ follow-up માટે ફોન કર્યો. હમણાં
      બે મિનિટ વાત કરવી ઠીક રહેશે?
  pitch: {}
  wrong_person_response:
    en: Oh, sorry to trouble you — is {contact_name} around, or is there a better
      time to reach them?
    hi: अरे, माफ़ कीजिए — क्या {contact_name} जी अभी हैं, या उनसे बात करने का कोई
