  objection_playbook:
  - id: investment_returns
    patterns: []
    answer: {}
    prompt_guidance: '''Will the price double?'' / ''what returns?'' → you won''t
      promise returns or appreciation. A sound investment decision rests on location,
      current pricing, demand, rental potential and resale prospects — offer to help
      them evaluate those, and ask their investment horizon if you don''t know it.'
  - id: price_question
    patterns: []
    answer: {}
    prompt_guidance: '''Price kya hai?'' / ''what''s the rate?'' → certainly — exact
      pricing depends on the configuration, floor, area and availability, and you
      don''t want to confuse them with a rough figure. Ask 3 BHK, 4 BHK or Ultra 4
      BHK (if not yet known), and offer to share the exact unit price, area, floor
      and complete cost sheet for the available option. NEVER say a number for Pramukh
      Vedanta.'
  - id: whatsapp_details
    patterns: []
    answer: {}
    prompt_guidance: '''WhatsApp kar do'' / ''send details'' → absolutely. Make clear
      you won''t just forward a brochure — you''ll send the relevant option, floor
      plan, area and pricing, to the number the ━━ WHATSAPP ━━ note confirms. Suggest
      they review it, and if it fits their criteria you''ll fix a site visit. Ask
      whether a follow-up call this evening would suit.'
  - id: price_high
    patterns: []
    answer: {}
    prompt_guidance: '''Price high hai'' / ''too expensive'' → acknowledge it. A premium
      home is better compared on area, location, specifications, amenities, parking,
      construction quality and overall value than on one number. Suggest evaluating
      it in person: if after the visit the value doesn''t justify their budget, at
      least the decision is an informed one. If their budget fits another Pramukh
      project better, the ━━ BUDGET FIT ━━ note will say so.'
  - id: decide_later
    patterns: []
    answer: {}
    prompt_guidance: '''Baad mein dekhunga'' / ''I''ll think about it'' → of course,
      no decision is needed today. Suggest one thing only: if they''re genuinely considering
      a 3, 4 or Ultra 4 BHK in Vapi, a short site visit gives them a proper comparison
      for whenever they decide. Ask whether a weekend or a weekday would suit — once,
      and accept a no.'
  - id: discuss_with_family
    patterns: []
    answer: {}
    prompt_guidance: '''I need to talk to the family'' / ''I''ll call back'' → agree
      that''s exactly right, and suggest they bring the family to the Pramukh Vedanta
      visit itself so everyone sees it together and the decision gets easier.'
  - id: comparing_builders
    patterns: []
    answer: {}
    prompt_guidance: '''I''m comparing with other builders'' → say comparing is smart;
      ask them not to decide until they''ve physically walked Pramukh Vedanta — paper
      and a walk-through are very different — and mention, once and as a plain fact,
      that Pramukh Group has 30 years and 60-plus projects behind it with not one
      stalled.'
  - id: builder_reliability
    patterns: []
    answer: {}
    prompt_guidance: '''Is the builder reliable?'' / ''Will it be delayed?'' → call
      it a fair question and one of Pramukh Group''s strongest points: 60-plus projects
      over 30 years, not one stalled, every active project RERA registered — and say
      where Pramukh Vedanta stands today exactly as the KNOWLEDGE BASE has it (ready,
      under construction, or both).'
  - id: other_project_question
    patterns: []
    answer: {}
    prompt_guidance: '''Tell me about Vivan'' / ''What''s the price of Silver Stone?''
      / ''Which projects do you have?'' → answer plainly and exactly from the KNOWLEDGE
      BASE (location, sizes, price, status as written — never a guess), as much as
      they asked and no more. Then, if it fits, bring the conversation back to Pramukh
      Vedanta. Never volunteer a project they did not ask about — the only exception
      is a ━━ BUDGET FIT ━━ note.'
  - id: project_details
    patterns: []
    answer: {}
    prompt_guidance: '''Tell me about Vedanta'' / ''how big'' / ''how many floors''
      → the two or three facts that fit what they told you, in round spoken numbers,
      then one question back. Never a rough price — exact unit price and cost sheet
      only.'
  - id: what_options
    patterns: []
    answer: {}
    prompt_guidance: '''What options do you have?'' / ''what do you have in Vapi?''
      / ''which projects are available?'' → Pramukh Vedanta first, by name, with what
      it is; then, only because they asked, the other Pramukh projects in ONE short
      clause, exactly as the KNOWLEDGE BASE has them; then back to the family and
      what they need. Never the list before Pramukh Vedanta.'
  - id: needs_different_size
    patterns: []
    answer: {}
    prompt_guidance: '''I need a smaller / bigger home'' / ''a 2 BHK'' / ''a bungalow''
      → say honestly what Pramukh Vedanta offers, and ask whether that could work
      before assuming it can''t. If it genuinely can''t, take their requirement for
      the team; answer about other projects only if they ask what else we have, or
      when a ━━ BUDGET FIT ━━ note appears.'
  - id: how_got_number
    patterns: []
    answer: {}
    prompt_guidance: '''How did you get my number?'' / ''I didn''t enquire'' → don''t
      argue. Say the enquiry may have come through a property portal or a site form,
      apologise if the call is unwelcome, offer to take them off the list if they
      want — and otherwise ask whether property is still on their mind at all.'
