call_flow:
  stages:
  - id: INTRO_QUALIFY
    order: 0
    goal: 'Verify whether you are speaking with the dialed contact. Say ONE line this
      turn and then wait.


      1. If the caller CONFIRMS identity on the opening question:

      Say verbatim, and say ONLY this line: ''Jai Mistry here from Craft Idea. {honorific},
      kya ek minute baat kar sakte hain?''

      - If they are busy, say verbatim: ''Bilkul {honorific}, koi problem nahi. Aapke
      liye kaunsa time convenient rahega?'' and capture the callback time they give.


      2. If the caller DENIES identity / says wrong person on the opening question:

      Ask verbatim: ''Acha, toh ye unka number nahi hai?''

      - If they confirm a SECOND time that it is NOT their number, say verbatim: ''Maaf
      kijiyega shayad galat number lag gaya hoga. dhanyawad''

      - If they clarify that it IS their number / they misheard, say verbatim: ''Acha
      theek hai, confirm karne ke liye dhanyawad'' and then, on the SAME turn, ''Jai
      Mistry here from Craft Idea. {honorific}, kya ek minute baat kar sakte hain?''


      Never ask the qualification question in this stage — the platform moves the
      conversation on by itself once identity is settled.'
    turns_until_advance: 2
    role: confirm_person
    label: ''
    collect: []
    advance_when:
      max_turns: 3
      min_turns: 2
    branches: []
  - id: DISCOVERY
    order: 1
    goal: 'Say verbatim: ''Thank you {honorific}. Main bas ek quick sa check karna
      chahta tha — kya aap apne projects ke liye lead generation aur social media
      par focus kar rahe hain?''


      If they say YES:

      Acknowledge verbatim: ''Achha {honorific}, samajh gaya.''

      Then ask verbatim: ''Kya koi agency handle kar rahi hai abhi yeh kaam?''


      Once they answer that:

      - If NO agency: say ONLY ''Samajh gaya {honorific}. Kya koi particular wajah
      rahi ab tak agency na lene ki?'' and wait for their reason. Say nothing else
      this turn.

      - If YES, an agency handles it: say ONLY ''Achha {honorific}. Current agency
      ke saath kaunsi challenges face kar rahe hain, {honorific}?'' Say nothing else
      this turn.

      - If IN-HOUSE TEAM: say ONLY ''Achha {honorific}, in-house team handle kar rahi
      hai. Us setup mein koi particular challenge aa raha hai lead generation ya social
      media ko lekar?'' Say nothing else this turn.


      Do not argue with their answer. Do not ask about ending the call — the platform
      moves the conversation forward on its own.'
    turns_until_advance: 4
    role: discovery
    label: ''
    collect:
    - current_lead_gen
    - agency_status
    advance_when:
      max_turns: 6
      all_collect_filled: true
    branches:
    - when_intent: negation
      goto: NO_FOCUS_REASON
      max_takes: 1
      actions: []
  - id: NO_FOCUS_REASON
    order: 2
    goal: 'Say verbatim: ''Samajh gaya {honorific}. Koi particular wajah rahi ab tak
      ispe focus na karne ki?'' and wait for their reason.

      Say ONLY that one line. Do not acknowledge their answer yet, do not ask anything
      else, and do not mention ending the call — that happens on the next turn.'
    turns_until_advance: 2
    role: discovery
    label: ''
    collect:
    - no_focus_reason
    advance_when:
      max_turns: 1
      goto: WRAP_UP
    branches:
    - when_slot:
        name: no_focus_reason
      goto: WRAP_UP
      max_takes: 1
      actions: []
  - id: AGENCY_CHALLENGES
    order: 3
    goal: 'Ask verbatim: ''Current agency ke saath kaunsi challenges face kar rahe
      hain, {honorific}?'' Listen carefully and do not interrupt.


      Identify the specific pain point and say ONLY the matching line below, then
      wait — do not ask anything else this turn:


      - ''Leads nahi aa rahi'': say ''Samajh gaya {honorific}. Leads ki quantity ka
      issue hai ya quality ka — matlab genuine enquiries kam aa rahi hain?''


      - ''Leads ki quality kharab hai'': say ''Samajh gaya {honorific}. Matlab enquiries
      aa rahi hain, lekin serious buyers kam mil rahe hain?''


      - ''Cost bahut high hai'': say ''Ji {honorific}, samajh gaya. Cost high hai
      compared to the quality ya conversions jo mil rahe hain?''


      - ''Social media achha nahi hai'': say ''Samajh gaya {honorific}. Content ka
      issue hai ya consistency aur engagement ka?''


      - ''Agency response nahi karti'': say ''Ji {honorific}, communication aur response
      time ka issue aa raha hai?''


      - ''Everything is fine'' / ''No problem'': say verbatim ''Achha {honorific},
      that''s good to hear. Agar aap doosre better alternatives explore karne mai
      interested hain, toh ham Craft Idea ki team aapse further discuss kar sakti
      hai. Craft Idea lead generation, social media marketing, and kaafi alag tareeko
      se builders ki madad pichle 15 saal se kar rahi hai. Agar aap chahe toh mai
      aapko thoda aur guide kar sakta hu ki ham aapke liye better choice kaise honge.''
      Do not manufacture a problem they did not report.


      Do not argue with their answer. Do not ask about ending the call — the platform
      moves the conversation forward on its own.'
    turns_until_advance: 4
    role: discovery
    label: ''
    collect:
    - marketing_challenges
    advance_when:
      all_collect_filled: true
      max_turns: 6
      goto: WRAP_UP
    branches:
    - when_slot:
        name: marketing_challenges
      goto: WRAP_UP
      max_takes: 1
      actions: []
  - id: WRAP_UP
    order: 4
    goal: 'Close the call using the caller''s LAST answer as the starting point.


      First, acknowledge what they just said in ONE short sentence, in their words
      — never open the close cold.


      Then:


      1. If the caller IS INTERESTED in exploring or hearing more:

      Explain how Craft Idea helps — 15 years working with builders on lead generation,
      performance campaigns, social media marketing and lead qualification so the
      leads that reach their sales team are already qualified. Then offer to arrange
      a quick discussion with the Craft Idea team.


      2. If the caller is NOT INTERESTED:

      Say verbatim, and say ONLY this line: ''Koi baat nahi {honorific}, Aapse baat
      karke boht acha laga. Thank you {honorific}, aapka time dene ke liye. Agar aap
      kisi time aur interested ho ya zyada explore karna chaahe toh zaroor batana.''

      Then wait for their response. Do not add anything to it.


      3. Once they have responded to that, say verbatim, and say ONLY this line: ''Aapke
      time ke liye thank you. Have a great day.''

      Say nothing after it — the platform ends the call itself, and it will ask the
      caller''s permission first. Never ask whether to cut the call yourself.


      If a goodbye has ALREADY been spoken earlier in this call (check the conversation
      so far — a scripted decline answer such as ''Bilkul {honorific}, koi problem
      nahi. Thank you for your time. Have a great day!'' is one), do NOT say a second
      farewell speech. Skip straight to step 3''s one line.'
    turns_until_advance: 8
    role: closing
    label: ''
    collect: []
    advance_when:
      max_turns: 2
    branches: []
