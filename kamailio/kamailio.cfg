#!KAMAILIO
#
# LesCall SIP edge (plan §4a) — signaling-only proxy in front of FreeSWITCH.
#
#   carrier -> Kamailio (public :5060) -> FreeSWITCH (private :5080)
#
# Kamailio does NOT do DID routing: it flood-checks, verifies the source IP
# against the SQLite-backed carrier allow-list (address table, grp 1, managed
# by shared/kamailio_acl.py), and relays everything to the FreeSWITCH backend
# in /etc/kamailio/dispatcher.list. RTP flows direct carrier<->FreeSWITCH.
#
# Install: copy to /etc/kamailio/kamailio.cfg (see deploy/RUNBOOK.md).

#!substdef "!LESCALL_PRIVATE_IP!10.160.0.8!g"
#!substdef "!LESCALL_PUBLIC_IP!35.207.225.237!g"
#!define DBURL "sqlite:///etc/kamailio/kamailio.db"

####### Global Parameters #########

debug=2
log_stderror=no
log_facility=LOG_LOCAL0
fork=yes
children=8
auto_aliases=no

# Two sockets:
#  - external (carrier-facing): private NIC :5060, advertises the public IP
#  - internal (FreeSWITCH-facing): private NIC :5064, NO advertise — FS must
#    see the private address in Record-Route, or every in-dialog request
#    (BYE!) would be sent to the NAT'd public IP, which a GCP instance cannot
#    hairpin to. rr's double-RR (default on) inserts both hops when a request
#    crosses sockets.
listen=udp:LESCALL_PRIVATE_IP:5060 advertise LESCALL_PUBLIC_IP:5060
listen=udp:LESCALL_PRIVATE_IP:5064

####### Modules Section ########

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "ctl.so"
loadmodule "jsonrpcs.so"
loadmodule "db_sqlite.so"
loadmodule "permissions.so"
loadmodule "dispatcher.so"
loadmodule "pike.so"

# ----- rr params -----
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)

# ----- pike params (flood detection) -----
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 4)

# ----- permissions params (carrier allow-list) -----
# address table, grp 1 = trusted carrier signaling IPs.
# db_mode=1: cache the table in memory; kamcmd permissions.addressReload
# re-reads it after shared/kamailio_acl.py rewrites the rows.
modparam("permissions", "db_url", DBURL)
modparam("permissions", "db_mode", 1)

# ----- dispatcher params (FreeSWITCH backends, setid 1) -----
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_probing_mode", 1)

####### Routing Logic ########

request_route {

    # -- flood detection (skip our own hosts: a busy FreeSWITCH sending BYEs
    #    must never be pike-blocked) --
    if ($si != "127.0.0.1" && $si != "LESCALL_PRIVATE_IP") {
        if (!pike_check_req()) {
            xlog("L_ALERT", "LESCALL pike blocking $rm from $si\n");
            drop;
        }
    }

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "LESCALL malformed SIP from $si:$sp\n");
        exit;
    }

    # -- CANCEL: relay within the existing transaction --
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    # -- in-dialog requests: just follow the route set --
    if (has_totag()) {
        if (loose_route()) {
            t_relay();
            exit;
        }
        if (is_method("ACK")) {
            if (t_check_trans()) {
                t_relay();
            }
            exit;
        }
        sl_send_reply("404", "Not Here");
        exit;
    }

    # -- keepalive probes to us --
    if (is_method("OPTIONS") && (uri == myself)) {
        sl_send_reply("200", "OK");
        exit;
    }

    # -- initial requests: source must be a trusted carrier --
    if (is_method("INVITE|REGISTER|SUBSCRIBE|MESSAGE|NOTIFY")) {
        route(CARRIER_ACL);
    }

    if (is_method("INVITE")) {
        record_route();
    }

    route(TO_FREESWITCH);
}

# Source-IP gate. The address table (grp 1) is rewritten by
# shared/kamailio_acl.py from the union of trunks.provider_ips and re-seeded
# at boot by deploy/lescall-kamailio-acl-seed.sh. If this table is ever empty,
# ALL inbound gets 403'd — that is what the boot seed unit protects against.
route[CARRIER_ACL] {
    if ($si == "127.0.0.1" || $si == "LESCALL_PRIVATE_IP" || $si == "LESCALL_PUBLIC_IP") {
        return;
    }
    if (allow_source_address("1")) {
        return;
    }
    xlog("L_WARN", "LESCALL ACL REJECT: untrusted $si (method $rm, ruri $ru)\n");
    sl_send_reply("403", "Forbidden");
    exit;
}

# Round-robin over the FreeSWITCH backend set with failover. Force the
# internal (non-advertised) socket so FS sees private addresses end-to-end.
route[TO_FREESWITCH] {
    if (!ds_select_dst("1", "4")) {
        send_reply("503", "Service Unavailable");
        exit;
    }
    $fs = "udp:LESCALL_PRIVATE_IP:5064";
    t_on_failure("RELAY_FAILOVER");
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

failure_route[RELAY_FAILOVER] {
    if (t_is_canceled()) {
        exit;
    }
    if (t_check_status("5[0-9][0-9]") || t_branch_timeout() || !t_branch_replied()) {
        if (ds_next_dst()) {
            t_on_failure("RELAY_FAILOVER");
            t_relay();
            exit;
        }
    }
}
