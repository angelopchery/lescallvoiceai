# agent.lescall.com -> frontend Docker container (lescall-dashboard) on 127.0.0.1:8081
# /api, /auth, /login and /static go straight to the FastAPI backend (:8080).
# The SPA itself sits behind an auth_request login wall backed by FastAPI
# sessions: /api/auth/me returns 200 with a valid session (or in single-tenant
# mode, i.e. before OAuth is configured — the wall is then a no-op) and 401
# otherwise, which nginx turns into a redirect to the branded /login page.
# Install: /etc/nginx/sites-enabled/agent.lescall  (see deploy/RUNBOOK.md §5)

# Rate-limit zone for the Razorpay webhook. It is the ONE endpoint on this
# host that is unauthenticated by design (its HMAC is the credential) and it
# lives in the same process that serves every dashboard and dial request, on a
# 2-core VM. Without a limit it is a free OOM/CPU lever for anyone who learns
# the URL. 10 r/s with a burst of 20 is far above Razorpay's real event rate.
limit_req_zone $binary_remote_addr zone=lescall_webhook:1m rate=10r/s;

# Rate-limit zone for the public integration API (/v1). The app already meters
# every ACCEPTED request per key (shared/public_api/ratelimit.py), but a flood
# of INVALID keys never reaches a per-key counter — it would just spend a
# database round trip each, on the same 2-core VM that carries live calls. This
# zone is the floor underneath the real limiter: far above any legitimate
# integration's rate, low enough that a scanner cannot saturate the box.
limit_req_zone $binary_remote_addr zone=lescall_api:5m rate=20r/s;

# Refuse an ENCODED SLASH (or backslash) in the request PATH.
#
# nginx decodes and normalises the URI BEFORE choosing a location, so
# `/v1/calls/..%2f..%2fetc/x` is matched as `/etc/x` — it escapes the /v1
# location entirely and lands on whatever the fallback serves. Nothing on this
# host has a legitimate reason to carry %2F inside a path segment (share
# tokens are base64url, call keys are `<digits>_<date>_<time>`, agent names are
# slugs), so the safe answer is to refuse it rather than to guess where the
# request was meant to go. The query string is deliberately EXCLUDED from the
# match — `?next=%2Fdashboard` is normal and must keep working.
map $request_uri $lescall_encoded_slash {
    default              0;
    "~^[^?]*%2[fF]"      1;
    "~^[^?]*%5[cC]"      1;
}

server {
    server_name agent.lescall.com;

    # Agent Builder document uploads (PDF/DOCX) can exceed the 1 MB default.
    client_max_body_size 25m;

    # See the `map` above: a path-encoded slash re-routes a request past the
    # location that was supposed to handle it.
    if ($lescall_encoded_slash) { return 400; }

    # ---- Razorpay webhook: unauthenticated by design, so bounded here ----
    # Declared BEFORE `location /api/` because an exact match wins regardless
    # of order, but keeping it adjacent makes the exception obvious on read.
    location = /api/billing/webhook/razorpay {
        limit_req zone=lescall_webhook burst=20 nodelay;
        # A webhook body is a few KB. Anything larger is not Razorpay.
        client_max_body_size 256k;
        client_body_buffer_size 256k;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
    }

    # ---- Meta WhatsApp webhook: unauthenticated by design, bounded here ----
    # Same shape as the Razorpay webhook above: its credential is the
    # X-Hub-Signature-256 HMAC checked by the app, so it needs the same rate
    # limit and body cap. Meta batches events; a payload stays well under 1 MB.
    location = /api/whatsapp/webhook {
        limit_req zone=lescall_webhook burst=40 nodelay;
        client_max_body_size 1m;
        client_body_buffer_size 1m;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
    }

    # ---- tracked links inside WhatsApp messages: /r/<token> ----
    # A CUSTOMER taps these, with no session — so they must not fall through
    # to `location /` and its login wall. The app records the click and 302s
    # to the brochure/form URL the token names.
    location /r/ {
        limit_req zone=lescall_api burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- internal session probe (auth_request) ----
    location = /_lescall_auth_probe {
        internal;
        proxy_pass http://127.0.0.1:8080/api/auth/me;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Content-Length    "";
        proxy_pass_request_body off;
    }

    # ---- login surface: FastAPI backend, no wall ----
    location /auth/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /login {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- public integration API: customer CRM/ERP systems ----
    # Deliberately NOT behind the auth_request session wall: its credential is
    # an API key, and shared/public_api/keys.py enforces the account's IP
    # allowlist, the key's scopes and the per-key rate limit itself. Placed
    # before `location /` so it never falls through to the SPA container.
    location /v1 {
        limit_req zone=lescall_api burst=40 nodelay;
        # A 500-contact bulk push is a few hundred KB; nothing here is an upload.
        client_max_body_size 2m;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # X-Real-IP is what the IP allowlist is evaluated against, and nginx
        # OVERWRITES it here — a client cannot forge its own source address.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Recording downloads stream straight from GCS and can be minutes long.
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
    }

    # ---- API + backend static pages: FastAPI direct (its own gate 401s).
    #      Skipping the container hop also keeps SSE single-proxied. ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE (/api/.../stream) friendly
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
    }
    location /static/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- favicon: outside the wall ----
    # Every page load — the login page included — makes the browser probe
    # /favicon.ico. Behind the wall that probe 302s to /login?next=/favicon.ico
    # and its return-cookie overwrote the real destination stashed one request
    # earlier, so every fresh login landed on /favicon.ico (auth.py now refuses
    # asset paths as destinations too). Serve the SPA's logo: it is the public
    # brand mark, no session data involved.
    location = /favicon.ico {
        proxy_pass         http://127.0.0.1:8081/logo.png;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ---- the SPA, behind the wall ----
    location / {
        auth_request /_lescall_auth_probe;
        error_page 401 403 = @lescall_login;

        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
    }
    # Bounce to login CARRYING the path the visitor asked for. Without $next
    # the wall throws the destination away and everyone lands on the homepage
    # after signing in — which silently breaks every deep link, share links
    # (whose whole payload is the token in the URL) most visibly of all.
    # $request_uri already includes the query string; FastAPI validates it as
    # a same-origin absolute path before redirecting, so this cannot be turned
    # into an open redirect.
    # Caveat: stock nginx has no URL-encoder, so a destination carrying its own
    # `&` loses everything after the first one. Share links are `/s/<token>` —
    # one path segment, no query at all — precisely so they are immune to this.
    location @lescall_login {
        return 302 /login?next=$request_uri;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/agent.lescall.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agent.lescall.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name agent.lescall.com;
    return 301 https://agent.lescall.com$request_uri;
}

# ---- default server: drop anything that is not a known hostname ----
# Without this, a request to the bare IP (or any stale DNS name still pointing
# here) falls through to the FIRST server block and is served as if it were
# agent.lescall.com. `444` closes the connection with no response at all, which
# also keeps scanners from fingerprinting the host.
# Install alongside the vhost as /etc/nginx/sites-enabled/000-lescall-default.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
